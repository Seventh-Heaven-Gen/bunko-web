<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>縦書きシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ivory: #fffff0;
    --ink: #2a2a24;
    --bg: #f5f5f0;
    --accent: #8b7355;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Shippori Mincho", "游明朝", "Yu Mincho", serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 24px 16px;
  }
  h1 {
    text-align: center; font-size: 1.3rem; font-weight: 500;
    letter-spacing: 0.15em; margin-bottom: 8px;
  }
  .subtitle {
    text-align: center; font-size: 0.8rem; color: var(--accent);
    margin-bottom: 32px;
  }
  .form { max-width: 600px; margin: 0 auto; }
  .row { margin-bottom: 16px; }
  .row label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--accent); }
  .row input, .row textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ccc;
    font-family: inherit; font-size: 1rem; background: #fff;
    border-radius: 2px;
  }
  .row input:focus, .row textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #text { height: 50vh; min-height: 200px; resize: vertical; line-height: 1.8; }
  .actions { text-align: center; margin-top: 24px; }
  #generate {
    font-family: inherit; font-size: 1rem; padding: 12px 48px;
    background: var(--ink); color: var(--ivory); border: none;
    letter-spacing: 0.2em; cursor: pointer; border-radius: 2px;
  }
  #generate:hover { background: #444; }
  #generate:disabled { opacity: 0.4; cursor: wait; }
  #status {
    text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--accent);
    min-height: 1.5em;
  }
  #print-link {
    display: inline-block; margin-top: 10px; font-size: 0.75rem;
    color: var(--accent); text-decoration: underline; cursor: pointer;
    background: none; border: none; font-family: inherit;
  }

  /* Print fallback — browser handles vertical text natively */
  #print-area { display: none; }
  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }
    .print-page {
      width: 210mm; height: 297mm; background: #fffff0;
      position: relative; overflow: hidden;
      page-break-after: always;
    }
    .print-page:last-child { page-break-after: auto; }
    .print-page .body-text {
      writing-mode: vertical-rl; text-orientation: mixed;
      font-family: "Shippori Mincho", serif;
      font-size: 11pt; line-height: 1.67; letter-spacing: 0.05em;
      line-break: strict; word-break: normal; white-space: pre-wrap;
      position: absolute; top: 18.5mm; right: 15.9mm;
      width: 158.8mm; height: 238.1mm;
      overflow: hidden; color: #2a2a24;
    }
    .print-page .page-number {
      position: absolute; left: 18.5mm; bottom: 7.4mm;
      font-size: 9pt; color: #2a2a24;
    }
    .print-page .page-header {
      writing-mode: vertical-rl; text-orientation: mixed;
      position: absolute; top: 4.8mm; left: 18.5mm;
      font-size: 7.5pt; color: #888; letter-spacing: 0.1em;
    }
    @page { size: A4 portrait; margin: 0; }
  }
</style>
</head>
<body>

<h1>縦書きシステム</h1>
<p class="subtitle">テキストを貼って縦書きPDFを生成</p>

<div class="form">
  <div class="row">
    <label for="title-input">タイトル</label>
    <input id="title-input" type="text" placeholder="作品タイトル">
  </div>
  <div class="row">
    <label for="author-input">著者名</label>
    <input id="author-input" type="text" placeholder="ペンネーム">
  </div>
  <div class="row">
    <label for="text">本文</label>
    <textarea id="text" placeholder="小説のテキストをここに貼り付けてください。&#10;&#10;段落は改行で区切ります。&#10;「台詞はカギ括弧で始めると字下げされません」"></textarea>
  </div>
  <div class="actions">
    <button id="generate">生成する</button>
    <br>
    <button id="print-link">PDF生成がうまくいかない場合：ブラウザの印刷機能を使う</button>
  </div>
  <div id="status"></div>
</div>

<div id="print-area"></div>

<script>
// ── A4 layout constants ──
// Page: 794x1123px (210x297mm at 96dpi)
// Text block: 600x900px at top:70 right:60
// Font: 11pt (~14.67px), line-height 1.67, letter-spacing 0.05em
var CHARS_PER_COL = 58;
var COLS_PER_PAGE = 24;

// Characters that need 90deg CW rotation for vertical text
var ROTATE = new Set(
  'ー〜～—–―…‥─＝' +
  '「」『』（）【】' +
  '〈〉《》〔〕〖〗' +
  '｛｝［］＜＞〝〟'
);

// Punctuation shifted to upper-right of cell
var PUNCT = new Set('。、，．');

function isHalfWidth(ch) {
  var c = ch.charCodeAt(0);
  if (c <= 0x024F) return true;
  if (c >= 0xFF61 && c <= 0xFF9F) return true;
  return false;
}

function paginate(text) {
  var rawParas = text.split(/\n/).filter(function(p) { return p.trim(); });
  var paragraphs = rawParas.map(function(p) {
    var t = p.trim();
    return t.charAt(0) === '「' ? t : '　' + t;
  });
  var pages = [];
  var current = [];
  var usedCols = 0;
  for (var pi = 0; pi < paragraphs.length; pi++) {
    var para = paragraphs[pi];
    var cols = Math.max(1, Math.ceil(para.length / CHARS_PER_COL));
    if (current.length > 0 && usedCols + cols > COLS_PER_PAGE) {
      pages.push(current.join('\n'));
      current = [];
      usedCols = 0;
    }
    if (cols > COLS_PER_PAGE && current.length === 0) {
      var cpp = CHARS_PER_COL * COLS_PER_PAGE;
      for (var i = 0; i < para.length; i += cpp) pages.push(para.slice(i, i + cpp));
      continue;
    }
    current.push(para);
    usedCols += cols;
  }
  if (current.length > 0) pages.push(current.join('\n'));
  return pages;
}

function drawPage(canvas, pageText, pageNum, title) {
  var S = 3;
  var PW = 794, PH = 1123;
  canvas.width = PW * S;
  canvas.height = PH * S;
  var ctx = canvas.getContext('2d');

  // ivory background
  ctx.fillStyle = '#fffff0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  var fs = Math.round(14.67 * S); // 44px
  var blockTop = 70 * S;
  var blockRight = (PW - 60) * S;
  var colPitch = (600 * S) / COLS_PER_PAGE;
  var charPitch = (900 * S) / CHARS_PER_COL;

  ctx.font = fs + 'px "Shippori Mincho", "Yu Mincho", serif';
  ctx.fillStyle = '#2a2a24';

  var col = 0, row = 0;
  var chars = Array.from(pageText);

  for (var ci = 0; ci < chars.length; ci++) {
    var ch = chars[ci];
    if (ch === '\n') { col++; row = 0; continue; }

    var cx = blockRight - col * colPitch - colPitch / 2;
    var cy = blockTop + row * charPitch + charPitch / 2;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (ROTATE.has(ch)) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 2);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    } else if (PUNCT.has(ch)) {
      ctx.fillText(ch, cx + fs * 0.28, cy - fs * 0.32);
    } else if (isHalfWidth(ch)) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 2);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(ch, cx, cy);
    }

    row++;
    if (row >= CHARS_PER_COL) { col++; row = 0; }
  }

  // page number
  ctx.font = Math.round(12 * S) + 'px "Shippori Mincho", serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(String(pageNum), 70 * S, (PH - 28) * S);

  // header (柱) — vertical
  if (title) {
    var hfs = Math.round(10 * S);
    ctx.font = hfs + 'px "Shippori Mincho", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var hChars = Array.from(title);
    var hy = 24 * S;
    for (var hi = 0; hi < hChars.length; hi++) {
      var hch = hChars[hi];
      if (ROTATE.has(hch) || isHalfWidth(hch)) {
        ctx.save();
        ctx.translate(70 * S, hy + hfs / 2);
        ctx.rotate(Math.PI / 2);
        ctx.fillText(hch, 0, 0);
        ctx.restore();
      } else {
        ctx.fillText(hch, 70 * S, hy + hfs / 2);
      }
      hy += hfs * 1.3;
    }
  }
}

async function generatePdf() {
  var btn = document.getElementById('generate');
  var status = document.getElementById('status');
  var text = document.getElementById('text').value.trim();
  var title = document.getElementById('title-input').value.trim();

  if (!text) { status.textContent = '本文を入力してください'; return; }

  btn.disabled = true;
  status.textContent = 'フォントを読み込んでいます…';

  // Preload font subsets for the pasted text
  var uniqueChars = Array.from(new Set(Array.from(text))).join('');
  try {
    await document.fonts.load('44px "Shippori Mincho"', uniqueChars);
  } catch (e) { /* proceed with fallback font */ }
  await document.fonts.ready;

  // Force canvas font cache
  var warmup = document.createElement('canvas');
  warmup.width = 200; warmup.height = 200;
  var wctx = warmup.getContext('2d');
  wctx.font = '44px "Shippori Mincho", serif';
  wctx.fillText(uniqueChars.substring(0, 50), 0, 44);

  var pages = paginate(text);
  status.textContent = pages.length + 'ページ — PDF生成中…';

  if (typeof window.jspdf === 'undefined') {
    status.textContent = 'PDFライブラリの読み込みに失敗しました。「ブラウザの印刷機能を使う」をお試しください。';
    btn.disabled = false;
    return;
  }

  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  var canvas = document.createElement('canvas');

  for (var i = 0; i < pages.length; i++) {
    if (i > 0) pdf.addPage();
    status.textContent = (i + 1) + ' / ' + pages.length + ' ページ…';

    drawPage(canvas, pages[i], i + 1, title);
    var dataUrl = canvas.toDataURL('image/jpeg', 0.95);
    pdf.addImage(dataUrl, 'JPEG', 0, 0, 210, 297);

    if (i % 3 === 2) await new Promise(function(r) { setTimeout(r, 0); });
  }

  pdf.save((title || '縦書き') + '.pdf');
  status.textContent = pages.length + 'ページのPDFを保存しました';
  btn.disabled = false;
}

// Print fallback — uses browser's native vertical text rendering
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function printView() {
  var text = document.getElementById('text').value.trim();
  var title = document.getElementById('title-input').value.trim();
  if (!text) return;
  var pages = paginate(text);
  var area = document.getElementById('print-area');
  area.innerHTML = '';
  for (var i = 0; i < pages.length; i++) {
    var d = document.createElement('div');
    d.className = 'print-page';
    if (title) {
      var h = document.createElement('div');
      h.className = 'page-header';
      h.textContent = title;
      d.appendChild(h);
    }
    var b = document.createElement('div');
    b.className = 'body-text';
    b.innerHTML = esc(pages[i]);
    d.appendChild(b);
    var pn = document.createElement('div');
    pn.className = 'page-number';
    pn.textContent = String(i + 1);
    d.appendChild(pn);
    area.appendChild(d);
  }
  window.print();
}

document.getElementById('generate').addEventListener('click', generatePdf);
document.getElementById('print-link').addEventListener('click', printView);
</script>
</body>
</html>
