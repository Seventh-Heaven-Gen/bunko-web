<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>縦書きシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ivory: #fffff0;
    --ink: #2a2a24;
    --bg: #f5f5f0;
    --accent: #8b7355;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Shippori Mincho", "游明朝", "Yu Mincho", serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 24px 16px;
  }
  h1 {
    text-align: center; font-size: 1.3rem; font-weight: 500;
    letter-spacing: 0.15em; margin-bottom: 8px;
  }
  .subtitle {
    text-align: center; font-size: 0.8rem; color: var(--accent);
    margin-bottom: 32px;
  }
  .form { max-width: 600px; margin: 0 auto; }
  .row { margin-bottom: 16px; }
  .row label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--accent); }
  .row input, .row textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #ccc;
    font-family: inherit; font-size: 1rem; background: #fff;
    border-radius: 2px;
  }
  .row input:focus, .row textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #text { height: 50vh; min-height: 200px; resize: vertical; line-height: 1.8; }
  .actions { text-align: center; margin-top: 24px; }
  #generate {
    font-family: inherit; font-size: 1rem; padding: 12px 48px;
    background: var(--ink); color: var(--ivory); border: none;
    letter-spacing: 0.2em; cursor: pointer; border-radius: 2px;
  }
  #generate:hover { background: #444; }
  #generate:disabled { opacity: 0.4; cursor: wait; }
  #status {
    text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--accent);
    min-height: 1.5em;
  }

  /* Off-screen render area — 3x scale for 288 DPI output */
  #render-area { position: fixed; left: -99999px; top: 0; }
  .render-page {
    width: 2382px; height: 3369px;
    background: var(--ivory);
    position: relative; overflow: hidden;
  }
  .render-page .body-text {
    writing-mode: vertical-rl; text-orientation: mixed;
    font-family: "Shippori Mincho", "游明朝", serif;
    font-size: 44px; line-height: 1.67; letter-spacing: 0.05em;
    line-break: strict; word-break: normal; white-space: pre-wrap;
    position: absolute; top: 210px; right: 180px;
    width: 1800px; height: 2700px;
    overflow: hidden; color: var(--ink);
  }
  .render-page .page-number {
    position: absolute; left: 210px; bottom: 84px;
    font-size: 36px; color: var(--ink);
  }
  .render-page .page-header {
    writing-mode: vertical-rl; text-orientation: mixed;
    position: absolute; top: 54px; left: 210px;
    font-size: 30px; color: #888; letter-spacing: 0.1em;
  }

  /* Print fallback */
  #print-area { display: none; }
  @media print {
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: block !important; }
    .print-page {
      width: 210mm; height: 297mm; background: #fffff0;
      position: relative; overflow: hidden;
      page-break-after: always;
    }
    .print-page:last-child { page-break-after: auto; }
    .print-page .body-text {
      writing-mode: vertical-rl; text-orientation: mixed;
      font-family: "Shippori Mincho", serif;
      font-size: 11pt; line-height: 1.67; letter-spacing: 0.05em;
      line-break: strict; word-break: normal; white-space: pre-wrap;
      position: absolute; top: 18.5mm; right: 15.9mm;
      width: 158.8mm; height: 238.1mm;
      overflow: hidden; color: #2a2a24;
    }
    .print-page .page-number {
      position: absolute; left: 18.5mm; bottom: 7.4mm;
      font-size: 9pt; color: #2a2a24;
    }
    .print-page .page-header {
      writing-mode: vertical-rl; text-orientation: mixed;
      position: absolute; top: 4.8mm; left: 18.5mm;
      font-size: 7.5pt; color: #888; letter-spacing: 0.1em;
    }
    @page { size: A4 portrait; margin: 0; }
  }
</style>
</head>
<body>

<h1>縦書きシステム</h1>
<p class="subtitle">テキストを貼って縦書きPDFを生成</p>

<div class="form">
  <div class="row">
    <label for="title-input">タイトル</label>
    <input id="title-input" type="text" placeholder="作品タイトル">
  </div>
  <div class="row">
    <label for="author-input">著者名</label>
    <input id="author-input" type="text" placeholder="ペンネーム">
  </div>
  <div class="row">
    <label for="text">本文</label>
    <textarea id="text" placeholder="小説のテキストをここに貼り付けてください。&#10;&#10;段落は改行で区切ります。&#10;「台詞はカギ括弧で始めると字下げされません」"></textarea>
  </div>
  <div class="actions">
    <button id="generate">生成する</button>
  </div>
  <div id="status"></div>
</div>

<div id="render-area"></div>
<div id="print-area"></div>

<script>
// A4 layout: 794x1123px at 96dpi = 210x297mm
// Text block: 600x900px, 58 chars x 24 columns
const CHARS_PER_COL = 58;
const COLS_PER_PAGE = 24;

function paginate(text) {
  const rawParas = text.split(/\n/).filter(function(p) { return p.trim(); });
  const paragraphs = rawParas.map(function(p) {
    var t = p.trim();
    return t.charAt(0) === '「' ? t : '　' + t;
  });
  var pages = [];
  var current = [];
  var usedCols = 0;
  for (var pi = 0; pi < paragraphs.length; pi++) {
    var para = paragraphs[pi];
    var cols = Math.max(1, Math.ceil(para.length / CHARS_PER_COL));
    if (current.length > 0 && usedCols + cols > COLS_PER_PAGE) {
      pages.push(current.join('\n'));
      current = [];
      usedCols = 0;
    }
    if (cols > COLS_PER_PAGE && current.length === 0) {
      var cpp = CHARS_PER_COL * COLS_PER_PAGE;
      for (var i = 0; i < para.length; i += cpp) pages.push(para.slice(i, i + cpp));
      continue;
    }
    current.push(para);
    usedCols += cols;
  }
  if (current.length > 0) pages.push(current.join('\n'));
  return pages;
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildRenderPages(pages, title) {
  var area = document.getElementById('render-area');
  area.innerHTML = '';
  var divs = [];
  for (var i = 0; i < pages.length; i++) {
    var d = document.createElement('div');
    d.className = 'render-page';
    if (title) {
      var h = document.createElement('div');
      h.className = 'page-header';
      h.textContent = title;
      d.appendChild(h);
    }
    var b = document.createElement('div');
    b.className = 'body-text';
    b.innerHTML = esc(pages[i]);
    d.appendChild(b);
    var pn = document.createElement('div');
    pn.className = 'page-number';
    pn.textContent = String(i + 1);
    d.appendChild(pn);
    area.appendChild(d);
    divs.push(d);
  }
  return divs;
}

async function generatePdf() {
  var btn = document.getElementById('generate');
  var status = document.getElementById('status');
  var text = document.getElementById('text').value.trim();
  var title = document.getElementById('title-input').value.trim();

  if (!text) { status.textContent = '本文を入力してください'; return; }

  btn.disabled = true;
  status.textContent = 'フォントを読み込んでいます…';
  await document.fonts.ready;

  var pages = paginate(text);
  status.textContent = pages.length + 'ページ — 描画中…';
  var divs = buildRenderPages(pages, title);

  await new Promise(function(r) { setTimeout(r, 300); });

  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  for (var i = 0; i < divs.length; i++) {
    if (i > 0) pdf.addPage();
    status.textContent = (i + 1) + ' / ' + divs.length + ' ページ…';

    try {
      var canvas = await domtoimage.toCanvas(divs[i], {
        bgcolor: '#fffff0',
        width: 2382,
        height: 3369
      });
      var dataUrl = canvas.toDataURL('image/jpeg', 0.95);
      pdf.addImage(dataUrl, 'JPEG', 0, 0, 210, 297);
    } catch (e) {
      console.error('Page ' + (i + 1) + ':', e);
      status.textContent = 'ページ' + (i + 1) + 'の描画に失敗しました';
      btn.disabled = false;
      return;
    }

    if (i % 3 === 2) await new Promise(function(r) { setTimeout(r, 0); });
  }

  pdf.save((title || '文庫') + '.pdf');
  status.textContent = pages.length + 'ページのPDFを保存しました';
  btn.disabled = false;
  document.getElementById('render-area').innerHTML = '';
}

document.getElementById('generate').addEventListener('click', generatePdf);
</script>
</body>
</html>
